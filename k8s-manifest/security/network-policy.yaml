apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# frontend: hit by loadgenerator AND the GCE load balancer / health checks (NEG).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: app
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: { app: loadgenerator }
    - ipBlock: { cidr: 130.211.0.0/22 }   # GCLB health-check range
    - ipBlock: { cidr: 35.191.0.0/16 }     # GCLB health-check range
    ports:
    - { protocol: TCP, port: 8080 }
---
# productcatalogservice: frontend, checkout, recommendation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-productcatalog
  namespace: app
spec:
  podSelector:
    matchLabels: { app: productcatalogservice }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: frontend } }
    - podSelector: { matchLabels: { app: checkoutservice } }
    - podSelector: { matchLabels: { app: recommendationservice } }
    ports:
    - { protocol: TCP, port: 3550 }
---
